[project]
name = "resume-cv-mcp-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.19.1",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "fastapi>=0.141.1",
    "fastmcp>=3.4.7",
    "python-multipart>=0.0.20",
    "uvicorn>=0.34.0",
    "uvloop>=0.21.0",
    "httptools>=0.6.4",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
    "cryptography>=45.0.0",
    "pyotp>=2.9.0",
]

[tool.fastapi]
entrypoint = "main:app"

[dependency-groups]
dev = [
    "fastapi[standard]>=0.141.1",
    "pre-commit>=4.0.0",
    "ruff>=0.16.4",
    "ty>=0.0.73",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "jsonschema>=4.0.0",
    "bandit>=1.9.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.run]
branch = true
source = ["."]
omit = [
    "alembic/*",
    "tests/*",
    "scratch.py",
    ".venv/*",
    "scripts/*",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
    'if __name__ == "__main__":',
]

[tool.ruff]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ty.src]
exclude = ["alembic/versions"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]
runtime-evaluated-decorators = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]


[tool.bandit]
exclude_dirs = ["tests", ".venv", "alembic"]
recurse = true
level = "MEDIUM"
confidence = "MEDIUM"